<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#075b83">
<title>EARTHVERSE — New World: Terra Nova</title>
<style>
:root{--panel:#082b43ef;--line:#bceaff66}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#087ca5;color:#fff;font-family:system-ui,Arial}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;inset:env(safe-area-inset-top,8px) 10px auto 10px;display:flex;gap:7px;z-index:4;align-items:flex-start;pointer-events:none}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:12px;backdrop-filter:blur(8px);box-shadow:0 3px 12px #001a2a55}
#status{flex:1;min-width:0}
#buttons{position:fixed;right:10px;top:65px;z-index:5;display:flex;flex-direction:column;gap:7px}
button{border:1px solid #c5ecff88;background:#092b45ef;color:white;border-radius:12px;padding:10px 12px;font-size:12px;font-weight:750;touch-action:manipulation}
#help{position:fixed;left:10px;bottom:12px;z-index:4;background:#082b43df;border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:11px;max-width:calc(100% - 150px);pointer-events:none}
#stick{position:fixed;left:18px;bottom:25px;width:112px;height:112px;border-radius:50%;background:#082b4388;border:2px solid #ffffff88;z-index:6;touch-action:none}
#knob{position:absolute;width:44px;height:44px;left:32px;top:32px;border-radius:50%;background:#f3fbff;border:2px solid #fff;box-shadow:0 2px 8px #001a2a66}
#dialog{display:none;position:fixed;z-index:10;left:50%;bottom:145px;transform:translateX(-50%);width:min(340px,90vw);background:#082b43f5;border:1px solid #c5ecff88;border-radius:15px;padding:13px;box-shadow:0 8px 28px #001a2a88}
#dialog strong{display:block;margin-bottom:5px}
#dialog p{font-size:13px;margin:5px 0 10px;color:#e4f5ff}
#dialog input{width:100%;padding:10px;border-radius:9px;border:1px solid #a8d9ee}
#dialog button{margin-top:8px;margin-right:5px}
#toast{display:none;position:fixed;top:105px;left:50%;transform:translateX(-50%);z-index:12;background:#082b43f5;padding:9px 13px;border-radius:12px;font-size:12px}
#mini{position:fixed;right:10px;bottom:12px;width:130px;height:100px;border:2px solid #e4f8ff;border-radius:10px;background:#063b58cc;z-index:3;opacity:.94}
@media(min-width:700px){#stick{width:130px;height:130px}#knob{left:40px;top:40px}#help{max-width:360px}}
</style>
</head>
<body>
<canvas id="world"></canvas>
<div id="hud"><div class="pill" id="status">EARTHVERSE · Discovering Terra Nova…</div><div class="pill">TERRA NOVA</div></div>
<div id="buttons">
<button id="save">SAVE WORLD</button>
<button id="talk">NEAREST CITIZEN</button>
<button id="zoomIn">ZOOM +</button>
<button id="zoomOut">ZOOM −</button>
</div>
<div id="help">EXPLORE TERRA NOVA · JOYSTICK TO MOVE · TAP A CITIZEN TO TALK</div>
<div id="stick"><div id="knob"></div></div>
<canvas id="mini" width="260" height="200"></canvas>
<div id="dialog"><strong id="person"></strong><p id="reply"></p><input id="message" maxlength="90" placeholder="Say hello…"><button id="send">SEND</button><button id="close">CLOSE</button></div>
<div id="toast"></div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false});
const mini=document.getElementById('mini'),mx=mini.getContext('2d');
const status=document.getElementById('status');
let W=innerWidth,H=innerHeight,dpr=Math.min(devicePixelRatio||1,1.5);
function resize(){W=innerWidth;H=innerHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
addEventListener('resize',resize);
const map={w:1800,h:1250};
let cam={x:900,y:625,zoom:Math.min(W/1100,H/760)*.9};
cam.zoom=Math.max(.36,Math.min(.82,cam.zoom));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function seededRandom(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
const rand=seededRandom(20271113);
const treeRnd=(a,b)=>a+rand()*(b-a);
const trees=[];
for(let i=0;i<340;i++){
 const x=treeRnd(230,1580),y=treeRnd(180,1080);
 const forest=((x-850)/330)**2+((y-650)/270)**2<1;
 const west=(x<620&&y>430&&y<900);
 const east=(x>1190&&y>400&&y<850);
 if((forest||west||east)&&rand()>.12)trees.push({x,y,s:treeRnd(.65,1.55)});
}
let day=1,minute=8*60,elapsed=0,selected=null,toastTimer=0;
const names=['Asha','Mira','Arun','Dev','Nila','Kavin','Ira','Ravi','Tara','Noah','Meena','Adhi','Sana','Vikram','Anu','Hari','Diya','Surya','Maya','Rohan','Priya','Ajay','Kavi','Naveen','Latha','Ishan','Keerthi','Manu','Riya','Bala','Sanjay','Divya','Gokul','Yazhini','Mohan','Aditi','Pranav','Sita','Vijay','Nithya','Rahul','Pooja','Arav','Janani','Dinesh','Kiran','Swetha','Varun','Anjali','Suresh'];
const jobs=['Farmer','Shopkeeper','Fisher','Builder','Teacher','Medic','Guard','Cook','Carpenter','Guide'];
const traits=['Friendly','Curious','Quiet','Ambitious','Helpful'];
const zones=[
 {x:430,y:780,rx:150,ry:95},{x:760,y:900,rx:170,ry:100},
 {x:850,y:650,rx:230,ry:180},{x:1080,y:300,rx:180,ry:100},
 {x:1370,y:560,rx:150,ry:120},{x:1450,y:880,rx:140,ry:90},
 {x:1110,y:1020,rx:180,ry:65},{x:570,y:330,rx:140,ry:95}
];
const citizens=names.map((name,i)=>{
 const z=zones[i%zones.length],a=i*2.39996,r=.25+(i%5)*.13;
 const x=z.x+Math.cos(a)*z.rx*r,y=z.y+Math.sin(a)*z.ry*r;
 return{id:i+1,name,age:18+(i*7)%48,job:jobs[i%jobs.length],trait:traits[i%traits.length],money:250+(i*73)%900,hunger:20+(i*11)%45,energy:70+(i*3)%30,happy:60+(i*5)%35,activity:'working',x,y,homeX:x,homeY:y,goal:'Live a good day',memories:[],friends:[],targetX:x,targetY:y,nextDecision:0,walking:false};
});
const player={x:900,y:820,speed:190};
let keys={},stick={x:0,y:0},stickId=null,drag=null,lastT=performance.now();
function hour(){return Math.floor(minute/60);}
function schedule(c){const h=hour();if(h<6||h>=22)c.activity='sleeping';else if(h<8)c.activity='commuting';else if(h<12||h<16)c.activity='working';else if(h<17)c.activity='eating';else if(h<20)c.activity='socializing';else c.activity='relaxing';if(c.hunger>85)c.activity='eating';if(c.energy<15)c.activity='sleeping';const goals={sleeping:'Rest and recover',commuting:'Travel to work',working:'Earn a living',eating:'Find food',socializing:'Meet neighbours',relaxing:'Enjoy island life'};c.goal=goals[c.activity];}
function save(){const data={day,minute,citizens,player};try{localStorage.setItem('earthverse_terra_nova_v1',JSON.stringify(data));toast('Terra Nova saved on this device.');}catch(e){toast('Save unavailable in this browser.');}}
function load(){try{const d=JSON.parse(localStorage.getItem('earthverse_terra_nova_v1')||'null');if(!d)return;day=d.day||1;minute=d.minute||480;if(d.player)Object.assign(player,d.player);if(Array.isArray(d.citizens))d.citizens.forEach(s=>{const c=citizens[s.id-1];if(c)Object.assign(c,s);});}catch(e){}}
load();
citizens.forEach(c=>{if(!Number.isFinite(c.homeX)){c.homeX=c.x;c.homeY=c.y;}if(!Number.isFinite(c.targetX)){c.targetX=c.x;c.targetY=c.y;}});
function toast(s){const el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.style.display='none',2200);}
function path(points,fill,stroke=null,lw=2){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke();}}
function ellipse(x,y,rx,ry,color){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();}
function tree(x,y,s=1){ellipse(x,y+13*s,17*s,7*s,'#76502e');ellipse(x,y,19*s,15*s,'#145d35');ellipse(x-10*s,y-8*s,14*s,12*s,'#247b42');ellipse(x+10*s,y-9*s,14*s,12*s,'#32934c');ellipse(x,y-15*s,11*s,10*s,'#50ad4e');}
function house(x,y,s=1,color='#c68b4e'){ctx.fillStyle='#80502e';ctx.fillRect(x-19*s,y-8*s,38*s,30*s);path([[x-25*s,y-8*s],[x,y-31*s],[x+25*s,y-8*s]],color,'#66351f',3);ctx.fillStyle='#f4d8a0';ctx.fillRect(x-6*s,y+4*s,12*s,18*s);ctx.fillStyle='#b8e5ed';ctx.fillRect(x+9*s,y-3*s,7*s,8*s);}
function label(t,x,y,size=25){ctx.textAlign='center';ctx.lineWidth=5;ctx.strokeStyle='#193b35';ctx.fillStyle='#fff';ctx.font=`900 ${size}px system-ui`;ctx.strokeText(t,x,y);ctx.fillText(t,x,y);}
function road(points,width=25){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#9d7950';ctx.lineWidth=width+8;ctx.stroke();ctx.strokeStyle='#dfbd83';ctx.lineWidth=width;ctx.stroke();}
function drawMap(){
 ctx.fillStyle='#075b86';ctx.fillRect(0,0,map.w,map.h);
 for(let i=0;i<145;i++){const x=(i*173)%map.w,y=(i*97)%map.h;ctx.strokeStyle='#75d7e477';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,8+(i%5)*3,.2,2.5);ctx.stroke();}
 // A broad new continent with fjords and a warm southern coast
 ctx.beginPath();ctx.moveTo(270,700);ctx.bezierCurveTo(170,520,300,270,520,210);ctx.bezierCurveTo(650,100,850,125,980,190);ctx.bezierCurveTo(1110,100,1390,190,1510,370);ctx.bezierCurveTo(1690,510,1620,760,1530,900);ctx.bezierCurveTo(1430,1100,1160,1140,980,1080);ctx.bezierCurveTo(790,1190,510,1080,390,980);ctx.bezierCurveTo(230,900,170,790,270,700);ctx.closePath();ctx.fillStyle='#dcb878';ctx.fill();
 ctx.beginPath();ctx.moveTo(295,690);ctx.bezierCurveTo(210,520,330,300,540,245);ctx.bezierCurveTo(680,145,850,165,985,225);ctx.bezierCurveTo(1120,145,1360,225,1480,390);ctx.bezierCurveTo(1630,535,1580,750,1490,875);ctx.bezierCurveTo(1390,1050,1160,1090,985,1035);ctx.bezierCurveTo(800,1130,540,1040,420,950);ctx.bezierCurveTo(280,870,220,785,295,690);ctx.closePath();ctx.fillStyle='#78b957';ctx.fill();ctx.strokeStyle='#f8e4b6';ctx.lineWidth=14;ctx.stroke();
 // Northern ice mountains
 path([[650,390],[690,250],[790,145],[900,210],[980,130],[1110,270],[1160,405],[1030,470],[820,455]],'#879f9a','#526d69',5);
 path([[690,260],[790,145],[845,235],[805,225],[770,280]],'#eef5ee');path([[900,210],[980,130],[1050,235],[1010,220],[970,275]],'#f5f6e9');path([[1020,300],[1090,245],[1160,405],[1090,380]],'#e7f0e8');
 // Golden desert in the east
 ellipse(1350,620,190,155,'#d8b45f');ellipse(1370,610,130,105,'#e7c979');
 for(let i=0;i<18;i++){const x=treeRnd(1220,1510),y=treeRnd(500,760);ctx.strokeStyle='#9c7439';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(x,y+18);ctx.lineTo(x,y-8);ctx.stroke();ellipse(x-7,y-7,9,5,'#557d42');ellipse(x+7,y-10,10,5,'#648b49');}
 // Fixed forests
 for(const t of trees)tree(t.x,t.y,t.s);
 // Central blue lake and river to the coast
 ellipse(870,650,145,92,'#258fa8');ellipse(870,650,112,66,'#45bfd0');
 ctx.beginPath();ctx.moveTo(930,690);ctx.bezierCurveTo(1050,740,1010,830,1130,870);ctx.bezierCurveTo(1230,920,1250,1000,1370,1050);ctx.lineCap='round';ctx.strokeStyle='#176d83';ctx.lineWidth=60;ctx.stroke();ctx.strokeStyle='#39b9cb';ctx.lineWidth=43;ctx.stroke();
 // Roads linking the settlements
 road([[450,780],[610,760],[760,820],[900,820],[1050,760],[1210,700],[1390,650]],26);
 road([[900,820],[850,690],[820,550],[900,440],[980,350]],22);
 road([[900,820],[980,930],[1130,980],[1320,960]],20);
 road([[760,820],[650,930],[500,950],[390,870]],20);
 // Western lighthouse and small harbor
 ellipse(330,430,72,55,'#7c786b');ctx.fillStyle='#eee6d2';ctx.fillRect(315,325,30,105);ctx.fillStyle='#c64c3b';ctx.fillRect(315,350,30,19);ctx.fillRect(315,390,30,18);ctx.fillRect(310,318,40,13);ellipse(330,310,18,8,'#ed634e');
 ellipse(420,930,110,68,'#24bfd0');ellipse(420,930,78,43,'#55d9df');ctx.fillStyle='#80512e';ctx.fillRect(335,925,145,12);for(let i=0;i<7;i++)ctx.fillRect(345+i*20,916,5,30);
 for(let i=0;i<4;i++){ctx.save();ctx.translate(365+i*38,970+(i%2)*15);ctx.rotate(-.2);path([[-18,0],[-9,-8],[17,-5],[22,0],[10,8],[-13,7]],i%2?'#f4e3bd':'#b7d9e4','#614d38',2);ctx.restore();}
 // Northern observatory
 ctx.fillStyle='#687d8b';ctx.fillRect(1010,300,110,58);ctx.fillStyle='#d8e3e5';ctx.beginPath();ctx.arc(1065,300,55,Math.PI,0);ctx.fill();ctx.fillStyle='#38515f';ctx.fillRect(1057,265,16,35);
 // Central town
 house(760,865,1.05,'#b98249');house(860,900,.95,'#d2a15a');house(940,850,.9,'#a96e3e');house(720,970,.9,'#c99558');house(965,970,1,'#bd884d');
 ellipse(850,950,13,8,'#e9a43a');ellipse(850,943,6,11,'#ffdf76');
 // Eastern desert temple
 path([[1320,510],[1435,510],[1490,605],[1375,605]],'#a69a7d','#716b59',3);ctx.fillStyle='#b9ad8e';ctx.fillRect(1340,465,105,48);ctx.fillRect(1355,435,75,30);ctx.fillRect(1370,405,45,30);for(let i=0;i<5;i++){ctx.fillStyle=i%2?'#8f876f':'#c2b493';ctx.fillRect(1315+i*31,590-i*8,28,12);}
 // Southern research and shipyard district
 ctx.fillStyle='#737d80';ctx.fillRect(1130,900,255,145);ctx.fillStyle='#a3a79c';ctx.beginPath();ctx.moveTo(1135,900);ctx.quadraticCurveTo(1255,790,1375,900);ctx.fill();ctx.fillStyle='#4f5a5b';ctx.fillRect(1160,915,190,82);
 for(let i=0;i<6;i++){ctx.fillStyle=['#c45c43','#477c68','#d19b45'][i%3];ctx.fillRect(1045+(i%3)*52,1020+Math.floor(i/3)*35,45,30);}
 // Snowy pine accents
 for(let i=0;i<16;i++){const x=treeRnd(650,1130),y=treeRnd(230,420);ellipse(x,y+10,12,5,'#6c705e');ellipse(x,y,13,20,'#315f55');path([[x-12,y-3],[x,y-26],[x+12,y-3]],'#dbe8df');}
 label('FROSTFALL PEAKS',900,190,25);label('WHISPERING WOODS',700,560,25);label('MIRROR LAKE',870,650,19);label('SUNSCORCH DESERT',1370,445,23);label('NOVA TOWN',850,790,26);label('WESTERN COVE',420,850,20);label('RESEARCH PORT',1255,1080,21);label('OLD TEMPLE',1400,385,18);label('LIGHTHOUSE',330,285,18);
}
function drawPerson(x,y,labelText,color,isPlayer=false){ellipse(x,y+8,12,5,'#24422c88');ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y-7,8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#f1c49a';ctx.beginPath();ctx.arc(x,y-18,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#3b2b22';ctx.lineWidth=2;ctx.stroke();ctx.textAlign='center';ctx.font='bold 12px system-ui';ctx.lineWidth=3;ctx.strokeStyle='#183b2d';ctx.strokeText(labelText,x,y-31);ctx.fillStyle='white';ctx.fillText(labelText,x,y-31);if(isPlayer){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-8,15,0,Math.PI*2);ctx.stroke();}}
function screenToWorld(x,y){return{x:(x-W/2)/cam.zoom+cam.x,y:(y-H/2)/cam.zoom+cam.y};}
function draw(){
 if(!ctx)return;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#087ca5';ctx.fillRect(0,0,W,H);
 ctx.save();ctx.translate(W/2-cam.x*cam.zoom,H/2-cam.y*cam.zoom);ctx.scale(cam.zoom,cam.zoom);
 drawMap();
 citizens.forEach((c,i)=>drawPerson(c.x,c.y,c.name,['#a64a37','#3f80a8','#dc9d36','#527d3e','#8b5ca7'][i%5]));
 drawPerson(player.x,player.y,'YOU','#e4f4ff',true);ctx.restore();drawMini();
}
function drawMini(){
 mx.clearRect(0,0,260,200);mx.fillStyle='#087ca5';mx.fillRect(0,0,260,200);
 mx.save();mx.translate(130,100);mx.scale(.125,.125);mx.translate(-900,-625);
 mx.beginPath();mx.moveTo(270,700);mx.bezierCurveTo(170,520,300,270,520,210);mx.bezierCurveTo(650,100,850,125,980,190);mx.bezierCurveTo(1110,100,1390,190,1510,370);mx.bezierCurveTo(1690,510,1620,760,1530,900);mx.bezierCurveTo(1430,1100,1160,1140,980,1080);mx.bezierCurveTo(790,1190,510,1080,390,980);mx.bezierCurveTo(230,900,170,790,270,700);mx.fillStyle='#78bd55';mx.fill();mx.strokeStyle='#f2d69b';mx.lineWidth=45;mx.stroke();
 mx.fillStyle='#fff';citizens.forEach(c=>mx.fillRect(c.x-8,c.y-8,16,16));mx.fillStyle='#e34b39';mx.fillRect(player.x-13,player.y-13,26,26);mx.restore();
}
function nearest(){let b=null,d=Infinity;for(const c of citizens){const n=Math.hypot(c.x-player.x,c.y-player.y);if(n<d){d=n;b=c;}}return d<90?b:null;}
function talk(c,msg){const m=msg.toLowerCase();let r;if(/hello|hi|hey|வணக்கம்/.test(m))r=`Hello! I'm ${c.name}. Welcome to our island.`;else if(/job|work/.test(m))r=`I work as a ${c.job}. Today I'm ${c.activity}.`;else if(/name/.test(m))r=`My name is ${c.name}. I'm ${c.trait.toLowerCase()} by nature.`;else if(/family|friend/.test(m))r='My neighbours are important to me. We help each other.';else if(/where|place/.test(m))r='I live on this island. I like visiting the village, jungle and coast.';else r=pick([`That's interesting. What do you think?`,`I need to ${c.goal.toLowerCase()}.`,`It's a peaceful day on our island.`]);c.memories.push({day,text:`You said: ${msg}`});if(c.memories.length>10)c.memories.shift();return r;}
function openCitizen(c){selected=c;document.getElementById('person').textContent=`${c.name} · ${c.age} · ${c.job}`;document.getElementById('reply').textContent=`${c.trait} citizen · ${c.activity} · Happiness ${Math.round(c.happy)}%`;document.getElementById('dialog').style.display='block';}
document.getElementById('send').onclick=()=>{if(!selected)return;const input=document.getElementById('message'),msg=input.value.trim()||'hello';document.getElementById('reply').textContent=selected.name+': '+talk(selected,msg);input.value='';};
document.getElementById('close').onclick=()=>document.getElementById('dialog').style.display='none';
document.getElementById('talk').onclick=()=>{const c=nearest();if(c)openCitizen(c);else toast('Move closer to a citizen first.');};
document.getElementById('save').onclick=save;
document.getElementById('zoomIn').onclick=()=>{cam.zoom=clamp(cam.zoom*1.15,.3,1.6);draw();};
document.getElementById('zoomOut').onclick=()=>{cam.zoom=clamp(cam.zoom/1.15,.3,1.6);draw();};
addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);
const stickEl=document.getElementById('stick'),knob=document.getElementById('knob');
function stickMove(e){const r=stickEl.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.34,l=Math.hypot(dx,dy)||1,f=Math.min(1,max/l);stick.x=dx*f/max;stick.y=dy*f/max;knob.style.transform=`translate(${stick.x*max}px,${stick.y*max}px)`;}
stickEl.addEventListener('pointerdown',e=>{stickId=e.pointerId;stickEl.setPointerCapture(e.pointerId);stickMove(e);});
stickEl.addEventListener('pointermove',e=>{if(e.pointerId===stickId)stickMove(e);});
function stickEnd(e){if(e.pointerId!==stickId)return;stickId=null;stick.x=stick.y=0;knob.style.transform='';}
stickEl.addEventListener('pointerup',stickEnd);stickEl.addEventListener('pointercancel',stickEnd);
canvas.addEventListener('pointerdown',e=>{const p=screenToWorld(e.clientX,e.clientY);let hit=null,dist=35/cam.zoom;for(const c of citizens){const d=Math.hypot(c.x-p.x,c.y-p.y);if(d<dist){hit=c;dist=d;}}if(hit){openCitizen(hit);return;}drag={id:e.pointerId,x:e.clientX,y:e.clientY,camX:cam.x,camY:cam.y};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;cam.x=clamp(drag.camX-(e.clientX-drag.x)/cam.zoom,0,map.w);cam.y=clamp(drag.camY-(e.clientY-drag.y)/cam.zoom,0,map.h);draw();});
canvas.addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId)drag=null;});canvas.addEventListener('pointercancel',()=>drag=null);
function chooseCitizenDestination(c,i){
 if(c.activity==='sleeping'){c.targetX=c.homeX;c.targetY=c.homeY;}
 else if(c.activity==='commuting'||c.activity==='working'){const col=i%10,row=Math.floor(i/10);c.targetX=690+col*48+(i%3)*5;c.targetY=790+row*25+(i%4)*4;}
 else if(c.activity==='socializing'){const angle=i*2.39996;c.targetX=820+Math.cos(angle)*(65+(i%4)*12);c.targetY=900+Math.sin(angle)*(45+(i%3)*10);}
 else if(c.activity==='eating'){c.targetX=760+(i%8)*28;c.targetY=875+(Math.floor(i/8)%4)*22;}
 else{const angle=i*1.7+elapsed*.03;c.targetX=c.homeX+Math.cos(angle)*(18+(i%4)*5);c.targetY=c.homeY+Math.sin(angle)*(14+(i%3)*5);}
 c.targetX=clamp(c.targetX,210,1600);c.targetY=clamp(c.targetY,180,1120);c.nextDecision=elapsed+5+(i%5)*1.2;
}
function update(dt){
 elapsed+=dt;minute+=dt*3;if(minute>=1440){minute-=1440;day++;}
 const h=hour(),vx=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0)+stick.x,vy=(keys.ArrowDown||keys.KeyS?1:0)-(keys.ArrowUp||keys.KeyW?1:0)+stick.y,len=Math.hypot(vx,vy)||1;
 player.x=clamp(player.x+vx/len*player.speed*dt,190,1650);player.y=clamp(player.y+vy/len*player.speed*dt,150,1150);
 citizens.forEach((c,i)=>{schedule(c);if(elapsed>=c.nextDecision)chooseCitizenDestination(c,i);const dx=c.targetX-c.x,dy=c.targetY-c.y,d=Math.hypot(dx,dy),speed=c.activity==='sleeping'?0:(c.activity==='commuting'?23:15),step=Math.min(d,speed*dt);if(d>1){c.x+=dx/d*step;c.y+=dy/d*step;c.walking=speed>0;}else{c.x=c.targetX;c.y=c.targetY;c.walking=false;}c.hunger=clamp(c.hunger+dt*.18,0,100);c.energy=clamp(c.energy+(c.activity==='sleeping'?dt*2.5:-dt*.45),0,100);c.happy=clamp(c.happy+(c.activity==='socializing'?dt*.35:-dt*.025),0,100);if(c.activity==='working')c.money+=dt*.3;});
 cam.x+=(player.x-cam.x)*Math.min(1,dt*1.6);cam.y+=(player.y-cam.y)*Math.min(1,dt*1.6);
 status.textContent=`EARTHVERSE · Day ${day} · ${String(h).padStart(2,'0')}:${String(Math.floor(minute%60)).padStart(2,'0')} · ${citizens.length} citizens`;
}
function loop(now){const dt=Math.min((now-lastT)/1000,.05);lastT=now;update(dt);draw();requestAnimationFrame(loop);}
resize();requestAnimationFrame(loop);
addEventListener('pagehide',()=>{try{localStorage.setItem('earthverse_terra_nova_v1',JSON.stringify({day,minute,citizens,player}));}catch(e){}});
})();
</script>
