<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820">
<title>EARTHVERSE | Phase 1</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
#world{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
#topbar{position:fixed;top:env(safe-area-inset-top,10px);left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
.panel{background:rgba(8,17,24,.72);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);border-radius:13px;padding:10px 12px;box-shadow:0 8px 24px #0004}
.brand{font-size:15px;font-weight:800;letter-spacing:2px}.sub{font-size:10px;color:#b9cbd3;margin-top:2px}
#stats{font-size:11px;color:#d5e5eb;text-align:right;line-height:1.6}
#controls{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:end;pointer-events:none}
#pad{display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:48px 48px 48px;gap:4px;pointer-events:auto}
.ctrl{border:1px solid #ffffff45;background:#10232dcc;color:white;border-radius:12px;font-size:19px;font-weight:700;touch-action:none;user-select:none}
.ctrl:active,.ctrl.active{background:#247b78}
#pad .up{grid-column:2;grid-row:1}#pad .left{grid-column:1;grid-row:2}#pad .down{grid-column:2;grid-row:2}#pad .right{grid-column:3;grid-row:2}
#actions{display:flex;flex-direction:column;gap:8px;pointer-events:auto;align-items:flex-end}
.action{font-size:12px;padding:11px 13px;min-width:118px;text-align:center}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:155px;background:#07131dcc;border:1px solid #ffffff2a;padding:7px 11px;border-radius:20px;font-size:10px;color:#d5e5eb;white-space:nowrap;pointer-events:none}
#toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#07131de8;padding:9px 13px;border-radius:10px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#101820;z-index:5;transition:opacity .4s}
#loading div{text-align:center}.spinner{width:34px;height:34px;border:3px solid #ffffff30;border-top-color:#6ee7c8;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(min-width:800px){#pad{opacity:.75}.ctrl{width:52px;height:52px}#hint{bottom:18px}}
</style>
</head>
<body>
<div id="world"></div>
<div id="topbar">
  <div class="panel"><div class="brand">EARTHVERSE</div><div class="sub">A LIVING AI PLANET · PHASE 1</div></div>
  <div class="panel" id="stats">CITIZENS <b id="citizenCount">10</b><br>TIME <b id="clock">08:00</b><br>MODE <b id="modeLabel">FOLLOW</b></div>
</div>
<div id="hint">Drag to look · Use arrows to move · Tap camera to switch</div>
<div id="controls">
  <div id="pad">
    <button class="ctrl up" data-key="forward">▲</button>
    <button class="ctrl left" data-key="left">◀</button>
    <button class="ctrl down" data-key="back">▼</button>
    <button class="ctrl right" data-key="right">▶</button>
  </div>
  <div id="actions">
    <button class="ctrl action" id="cameraBtn">📷 Camera: Follow</button>
    <button class="ctrl action" id="timeBtn">🌙 Night mode</button>
    <button class="ctrl action" id="resetBtn">↺ Reset view</button>
  </div>
</div>
<div id="toast"></div>
<div id="loading"><div><div class="spinner"></div><b>BUILDING EARTHVERSE</b><div class="sub">Preparing your first city...</div></div></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const mount=document.getElementById('world');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bc8dc);
scene.fog=new THREE.Fog(0x9bc8dc,85,230);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
camera.position.set(0,8,15);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
mount.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xd9efff,0x64715b,2.0);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffedcf,2.6);
sun.position.set(-35,60,25);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-75;sun.shadow.camera.right=75;sun.shadow.camera.top=75;sun.shadow.camera.bottom=-75;
scene.add(sun);

const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});
const groundMat=mat(0x6d9368),roadMat=mat(0x343b40),sideMat=mat(0xb8b8a8),lineMat=mat(0xe7dfb8);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(260,260),groundMat);ground.rotation.x=-Math.PI/2;ground.position.y=-.08;ground.receiveShadow=true;scene.add(ground);

function box(w,h,d,material,x,y,z,cast=true){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;scene.add(m);return m;
}
// Main roads
function road(w,d,x,z){
 box(w,.12,d,roadMat,x,.0,z,false);
 box(w,.08,.18,lineMat,x,.08,z-d/2+1.2,false);
 box(w,.08,.18,lineMat,x,.08,z+d/2-1.2,false);
}
road(220,13,0,0);road(13,220,0,0);road(220,9,0,48);road(220,9,0,-48);road(9,220,48,0);road(9,220,-48,0);
// Lane dashes
for(let i=-100;i<=100;i+=9){box(3,.025,.22,lineMat,i,.075,0,false);box(.22,.025,3,lineMat,0,.075,i,false)}
// Sidewalk blocks
for(let z=-100;z<=100;z+=24){for(let x=-100;x<=100;x+=24){if(Math.abs(x)<12||Math.abs(z)<12)continue;box(17,.16,17,sideMat,x,.04,z,false)}}

const buildingMats=[0xd9d2c4,0xb7c8c8,0xd5bda0,0x9cabb6,0xe0dfd5,0xc2b6a5].map(c=>mat(c));
const roofMat=mat(0x555e64);
const windowMat=new THREE.MeshStandardMaterial({color:0x8db8c8,roughness:.3,metalness:.15});
function building(x,z,w,d,h,idx){
 const base=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),buildingMats[idx%buildingMats.length]);
 base.position.set(x,h/2+.16,z);base.castShadow=true;base.receiveShadow=true;scene.add(base);
 const roof=new THREE.Mesh(new THREE.BoxGeometry(w+.25,.25,d+.25),roofMat);roof.position.set(x,h+.25,z);roof.castShadow=true;scene.add(roof);
 // front window rows
 const rows=Math.min(5,Math.floor(h/2.8));
 for(let r=0;r<rows;r++)for(let c=0;c<Math.max(1,Math.floor(w/2.8));c++){
  const wx=x-w/2+1.5+c*2.8,wy=2+r*2.7;
  const win=new THREE.Mesh(new THREE.BoxGeometry(.9,1.15,.06),windowMat);win.position.set(wx,wy,z-d/2-.04);scene.add(win);
 }
}
// Building plots
let seed=17;function rand(){seed=(seed*9301+49297)%233280;return seed/233280}
let idx=0;
for(let z=-90;z<=90;z+=24)for(let x=-90;x<=90;x+=24){
 if(Math.abs(x)<19||Math.abs(z)<19)continue;
 const w=8+rand()*6,d=8+rand()*6,h=7+rand()*19;
 building(x+(rand()-.5)*3,z+(rand()-.5)*3,w,d,h,idx++);
}
// Landmark tower and park
building(20,20,12,12,34,2);
const park=mat(0x4e8a55);
box(20,.18,20,park,-22,.08,-22,false);
function tree(x,z,s=1){
 const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.18*s,.25*s,2*s,7),mat(0x6c4930));trunk.position.set(x,s,z);trunk.castShadow=true;scene.add(trunk);
 const crown=new THREE.Mesh(new THREE.SphereGeometry(1.25*s,8,7),mat(0x39764b));crown.position.set(x,2.5*s,z);crown.castShadow=true;scene.add(crown);
}
for(let i=0;i<65;i++){
 let x=(rand()-.5)*190,z=(rand()-.5)*190;
 if(Math.abs(x)<13||Math.abs(z)<13)continue;
 if(Math.abs(x)<34&&Math.abs(z)<34)continue;
 tree(x,z,.7+rand()*.6);
}
for(let i=0;i<12;i++)tree(-29+(i%4)*4,-29+Math.floor(i/4)*4,.85);

// Citizen characters: lightweight stylized humanoids
const citizens=[];
const skinMats=[0xb87952,0x8f5d43,0xd5a17c,0x9c694e].map(c=>mat(c));
const shirtMats=[0x287b78,0x456b9b,0xb36c42,0x76548d,0x9b4f50].map(c=>mat(c));
function citizen(i){
 const g=new THREE.Group();
 const shirt=shirtMats[i%shirtMats.length],skin=skinMats[i%skinMats.length];
 const body=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.65,3,7),shirt);body.position.y=1.05;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.27,10,8),skin);head.position.y=1.72;head.castShadow=true;g.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.275,10,6,0,Math.PI*2,0,Math.PI*.55),mat(0x292522));hair.position.y=1.79;g.add(hair);
 const legMat=mat(0x303a45);
 const legs=[];
 for(let n=0;n<2;n++){const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.48,3,6),legMat);leg.position.set(n===0?-.17:.17,.42,0);leg.castShadow=true;g.add(leg);legs.push(leg)}
 g.position.set((rand()-.5)*42,0,(rand()-.5)*42);
 scene.add(g);
 citizens.push({group:g,legs,phase:rand()*6.28,speed:.7+rand()*.5,angle:rand()*Math.PI*2,turn:0});
}
for(let i=0;i<10;i++)citizen(i);

const player=new THREE.Group();player.position.set(0,0,8);scene.add(player);
const playerBody=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.75,4,8),mat(0x38a6a0));playerBody.position.y=1.15;playerBody.castShadow=true;player.add(playerBody);
const playerHead=new THREE.Mesh(new THREE.SphereGeometry(.29,12,10),mat(0xc58d69));playerHead.position.y=1.9;playerHead.castShadow=true;player.add(playerHead);
const playerHair=new THREE.Mesh(new THREE.SphereGeometry(.3,12,8,0,Math.PI*2,0,Math.PI*.55),mat(0x252321));playerHair.position.y=1.98;player.add(playerHair);

let follow=true,night=false,clockMinutes=8*60;
let yaw=0,pitch=.25,dragging=false,lastX=0,lastY=0;
const keys={forward:false,back:false,left:false,right:false};
const clockEl=document.getElementById('clock');
const modeEl=document.getElementById('modeLabel');
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity=1;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.opacity=0,1800)}
function setNight(v){
 night=v;
 const c=night?0x101a2c:0x9bc8dc;scene.background.setHex(c);scene.fog.color.setHex(c);
 sun.intensity=night?.22:2.6;hemi.intensity=night?.42:2.0;
 renderer.toneMappingExposure=night?.65:1;
 document.getElementById('timeBtn').textContent=night?'☀️ Day mode':'🌙 Night mode';
 toast(night?'Night mode enabled':'Day mode enabled');
}
document.getElementById('timeBtn').onclick=()=>setNight(!night);
document.getElementById('cameraBtn').onclick=()=>{
 follow=!follow;modeEl.textContent=follow?'FOLLOW':'FREE';
 document.getElementById('cameraBtn').textContent=follow?'📷 Camera: Follow':'📷 Camera: Free';
 toast(follow?'Third-person follow camera':'Free camera: drag to look');
};
document.getElementById('resetBtn').onclick=()=>{player.position.set(0,0,8);yaw=0;pitch=.25;follow=true;modeEl.textContent='FOLLOW';document.getElementById('cameraBtn').textContent='📷 Camera: Follow';toast('View reset')};

document.querySelectorAll('[data-key]').forEach(btn=>{
 const k=btn.dataset.key;
 const on=e=>{e.preventDefault();keys[k]=true;btn.classList.add('active')};
 const off=e=>{e.preventDefault();keys[k]=false;btn.classList.remove('active')};
 btn.addEventListener('pointerdown',on);btn.addEventListener('pointerup',off);
 btn.addEventListener('pointercancel',off);btn.addEventListener('pointerleave',off);
});
addEventListener('keydown',e=>{if(e.code==='KeyW'||e.code==='ArrowUp')keys.forward=true;if(e.code==='KeyS'||e.code==='ArrowDown')keys.back=true;if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=true;if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=true});
addEventListener('keyup',e=>{if(e.code==='KeyW'||e.code==='ArrowUp')keys.forward=false;if(e.code==='KeyS'||e.code==='ArrowDown')keys.back=false;if(e.code==='KeyA'||e.code==='ArrowLeft')keys.left=false;if(e.code==='KeyD'||e.code==='ArrowRight')keys.right=false});

renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId)});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.004;pitch=Math.max(-.15,Math.min(.85,pitch+dy*.003));});
renderer.domElement.addEventListener('pointerup',()=>dragging=false);
renderer.domElement.addEventListener('pointercancel',()=>dragging=false);

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
 // player movement relative to camera heading
 const forward=(keys.forward?1:0)-(keys.back?1:0),side=(keys.right?1:0)-(keys.left?1:0);
 const moving=forward!==0||side!==0;
 if(moving){
  const a=yaw;
  const dx=Math.sin(a)*forward+Math.cos(a)*side;
  const dz=Math.cos(a)*forward-Math.sin(a)*side;
  const len=Math.hypot(dx,dz)||1;
  player.position.x+=dx/len*7*dt;player.position.z+=dz/len*7*dt;
  player.rotation.y=Math.atan2(dx,dz);
 }
 player.position.x=THREE.MathUtils.clamp(player.position.x,-108,108);
 player.position.z=THREE.MathUtils.clamp(player.position.z,-108,108);
 playerBody.position.y=1.15+(moving?Math.abs(Math.sin(t*10))*.06:0);
 // citizens wander around their local area
 for(const c of citizens){
  c.phase+=dt*c.speed*5;
  c.turn-=dt;
  if(c.turn<=0){c.angle+=(rand()-.5)*2.2;c.turn=1.5+rand()*4}
  c.group.position.x+=Math.sin(c.angle)*c.speed*dt;
  c.group.position.z+=Math.cos(c.angle)*c.speed*dt;
  c.group.position.x=THREE.MathUtils.clamp(c.group.position.x,-105,105);
  c.group.position.z=THREE.MathUtils.clamp(c.group.position.z,-105,105);
  c.group.rotation.y=c.angle;
  c.legs[0].rotation.x=Math.sin(c.phase)*.65;c.legs[1].rotation.x=-Math.sin(c.phase)*.65;
 }
 clockMinutes=(clockMinutes+dt*2)%1440;
 const hh=Math.floor(clockMinutes/60),mm=Math.floor(clockMinutes%60);
 clockEl.textContent=String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
 // camera follow or free orbit
 if(follow){
  const dist=9;
  const target=new THREE.Vector3(player.position.x-Math.sin(yaw)*dist,3.5+pitch*3,player.position.z-Math.cos(yaw)*dist);
  camera.position.lerp(target,1-Math.pow(.001,dt));
  camera.lookAt(player.position.x,1.3,player.position.z);
 }else{
  const target=new THREE.Vector3(player.position.x,1.5,player.position.z);
  const dir=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));
  camera.position.lerp(target.clone().add(dir.multiplyScalar(-10)),.08);
  camera.lookAt(target);
 }
 renderer.render(scene,camera);
}
animate();
document.getElementById('citizenCount').textContent=citizens.length;
setTimeout(()=>{const l=document.getElementById('loading');l.style.opacity=0;setTimeout(()=>l.remove(),450);toast('Welcome to EARTHVERSE!')},700);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
</script>
</body>
</html>
